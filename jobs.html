<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>求人情報</title>
  <style>
    .match-3 { background: #f88; }
    .match-2 { background: #ff8; }
    .match-1 { background: #8f8; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 0.5em; }
  </style>
</head>
<body>
  <h1>求人情報</h1>
  <label>キーワード（カンマ区切りで最大3つ）:
    <input id="keywords" type="text" placeholder="例：東京,未経験,高収入">
  </label>
  <button onclick="applyFilter()">フィルター適用</button>

  <div id="jobs"></div>

  <script>
    let jobData = [];

    fetch('data/jobData.json')
      .then(r => r.json())
      .then(d => {
        jobData = d;
        renderTable(jobData);
      })
      .catch(err => {
        document.getElementById('jobs').innerHTML = '<p style="color:red;">データの読み込みに失敗しました</p>';
        console.error(err);
      });

    function applyFilter() {
      const kw = document.getElementById('keywords').value
        .split(',')
        .map(s => s.trim())
        .filter(s => s);

      if (kw.length === 0) {
        renderTable(jobData);
        return;
      }

      const filtered = jobData.map(job => {
        const text = `${job.title} ${job.company} ${job.location} ${job.salary} ${job.note}`;
        const matches = kw.reduce((count, k) => count + (text.includes(k) ? 1 : 0), 0);
        return { ...job, matches };
      })
      .filter(j => j.matches > 0)
      .sort((a, b) => b.matches - a.matches);

      renderTable(filtered);
    }

    function renderTable(data) {
      const div = document.getElementById('jobs');
      if (!data.length) {
        div.innerHTML = '<p>該当求人なし</p>';
        return;
      }

      let html = '<table><thead><tr><th>タイトル</th><th>会社</th><th>勤務地</th><th>給与</th><th>備考</th></tr></thead><tbody>';
      for (const job of data) {
        // 空行はスキップ
        if (!job.title && !job.company && !job.location && !job.salary && !job.note) continue;

        const cls = `match-${job.matches || 0}`;
        html += `<tr class="${cls}">
          <td>${job.title || ''}</td>
          <td>${job.company || ''}</td>
          <td>${job.location || ''}</td>
          <td>${job.salary || ''}</td>
          <td>${job.note || ''}</td>
        </tr>`;
      }
      html += '</tbody></table>';
      div.innerHTML = html;
    }
  </script>
</body>
</html>
