<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>危険度＆業種グラフ</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: sans-serif; padding: 20px; background: #fff; }
canvas { max-width: 800px; height: 400px; display: block; margin: 30px auto; }
h2 { text-align: center; }
</style>
</head>
<body>

<h2>危険度別 求人件数</h2>
<canvas id="dangerChart"></canvas>

<h2>業種別 求人件数</h2>
<canvas id="industryChart"></canvas>

<script>
// 危険度グラフ
new Chart(document.getElementById('dangerChart').getContext('2d'), {
    type: 'bar',
    data: {
        labels: ["危険度1","危険度2","危険度3"],
        datasets: [{
            label: "件数",
            data: [106,17,0],
            backgroundColor: ["rgba(100,149,237,0.6)", "rgba(255,165,0,0.6)", "rgba(255,99,132,0.7)"]
        }]
    },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
});

// 業種グラフ
new Chart(document.getElementById('industryChart').getContext('2d'), {
    type: 'bar',
    data: {
        labels: ["その他","医療・介護","事務","建設","介護","営業","IT"],
        datasets: [{
            label: "件数",
            data: [491,80,59,95,220,93,12],
            backgroundColor: "rgba(60,179,113,0.6)"
        }]
    },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
});
</script>

</body></html>
