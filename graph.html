<!DOCTYPE html><html lang='ja'><head><meta charset='UTF-8'>
<title>危険度グラフ</title>
<script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
<style>
body { font-family: sans-serif; padding: 20px; background: #fff; }
canvas { max-width: 1000px; height: 500px; display: block; margin: auto; }
ul { margin-top: 30px; font-size: 14px; color: #444; line-height: 1.6; }
</style></head><body>
<h2>危険度別の企業数（1企業1カウント）</h2>
<canvas id='dangerChart'></canvas>
<ul>
<li>🟥 危険度3 = 赤背景（例: 高収入・即戦力・寮完備）</li>
<li>🟧 危険度2 = オレンジ背景（例: 評価不明・長時間労働）</li>
<li>🟦 危険度1 = 青背景（例: 離職率・マニュアルなし）</li>
</ul>
<script>
const ctx = document.getElementById('dangerChart').getContext('2d');
new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ["危険度1", "危険度2", "危険度3"],
        datasets: [{
            label: "企業数",
            data: [91, 5, 0],
            backgroundColor: ["rgba(100,149,237,0.6)", "rgba(255,165,0,0.6)", "rgba(255,99,132,0.7)"]
        }]
    },
    options: {
        responsive: true,
        plugins: {
            tooltip: {
                callbacks: {
                    label: function(ctx) { return " " + ctx.raw + " 社"; }
                }
            },
            title: { display: true, text: "危険度別 企業数の分布" },
            legend: { display: false }
        },
        scales: {
            y: { beginAtZero: true, title: { display: true, text: "企業数" } }
        }
    }
});
</script>
</body></html>
